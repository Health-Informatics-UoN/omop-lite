name: Run System Tests
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:

jobs:
  run-tests:
    name: Run System Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omop
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Password123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t omop-lite .

      # 99 persons
      - name: Run Docker container for PostgreSQL
        run: |
          docker run --rm --network=host \
          -e DB_HOST=localhost \
          -e DB_PASSWORD=postgres \
          -e DB_NAME=omop \
          -e SCHEMA_NAME=omop \
          -e DB_USER=postgres \
          -e DB_PORT=5432 \
          -e SYNTHETIC=true \
          omop-lite

      - name: Verify data in PostgreSQL
        run: |
          docker run --rm --network=host \
          -e PGPASSWORD=postgres \
          postgres psql -h localhost -U postgres -d omop -c "DO \$\$ BEGIN IF (SELECT COUNT(*) FROM omop.person) != 99 THEN RAISE EXCEPTION 'Expected 99 persons, got %', (SELECT COUNT(*) FROM omop.person); ELSE RAISE NOTICE 'PASS: Person count is 99'; END IF; END \$\$;"

      # 1000 persons
      - name: Run Docker container for PostgreSQL
        run: |
          docker run --rm --network=host \
          -e DB_HOST=localhost \
          -e DB_PASSWORD=postgres \
          -e DB_NAME=omop \
          -e SCHEMA_NAME=omop_1000 \
          -e DB_USER=postgres \
          -e DB_PORT=5432 \
          -e SYNTHETIC=true \
          -e SYNTHETIC_NUMBER=1000 \
          omop-lite

      - name: Verify data in PostgreSQL
        run: |
          docker run --rm --network=host \
          -e PGPASSWORD=postgres \
          postgres psql -h localhost -U postgres -d omop -c "DO \$\$ BEGIN IF (SELECT COUNT(*) FROM omop_1000.person) != 1130 THEN RAISE EXCEPTION 'Expected 1130 persons, got %', (SELECT COUNT(*) FROM omop_1000.person); ELSE RAISE NOTICE 'PASS: Person count is 1130'; END IF; END \$\$;"

      # 99 persons
      - name: Run Docker container for SQL Server
        run: |
          docker run --rm --network=host \
          -e DB_HOST=localhost \
          -e DB_PASSWORD=Password123! \
          -e DB_NAME=master \
          -e SCHEMA_NAME=omop \
          -e DB_USER=SA \
          -e DB_PORT=1433 \
          -e DIALECT=mssql \
          -e SYNTHETIC=true \
          omop-lite

      - name: Verify data in SQL Server
        run: |
          docker run --rm --network=host \
          mcr.microsoft.com/mssql-tools \
          /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'Password123!' -Q "DECLARE @count INT = (SELECT COUNT(*) FROM omop.person); IF @count != 99 BEGIN RAISERROR('Expected 99 persons, got %d', 16, 1, @count) END ELSE SELECT 'PASS: Person count is 99' as result;"

      # 1000 persons
      - name: Run Docker container for SQL Server
        run: |
          docker run --rm --network=host \
          -e DB_HOST=localhost \
          -e DB_PASSWORD=Password123! \
          -e DB_NAME=master \
          -e SCHEMA_NAME=omop_1000 \
          -e DB_USER=SA \
          -e DB_PORT=1433 \
          -e DIALECT=mssql \
          -e SYNTHETIC=true \
          -e SYNTHETIC_NUMBER=1000 \
          omop-lite

      - name: Verify data in SQL Server
        run: |
          docker run --rm --network=host \
          mcr.microsoft.com/mssql-tools \
          /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'Password123!' -Q "DECLARE @count INT = (SELECT COUNT(*) FROM omop_1000.person); IF @count != 1130 BEGIN RAISERROR('Expected 1130 persons, got %d', 16, 1, @count) END ELSE SELECT 'PASS: Person count is 1130' as result;"

      # DuckDB is file-based, so no service container is needed - just a
      # mounted directory to write the .duckdb file into and read it back
      # from on the runner.
      # 99 persons
      - name: Run Docker container for DuckDB
        run: |
          mkdir -p duckdb-out
          chmod 777 duckdb-out
          docker run --rm \
          -v "$PWD/duckdb-out:/data" \
          -e DIALECT=duckdb \
          -e DB_NAME=/data/omop.duckdb \
          -e SYNTHETIC=true \
          omop-lite

      - name: Verify data in DuckDB
        run: |
          pip install duckdb
          python3 -c "
          import duckdb
          con = duckdb.connect('duckdb-out/omop.duckdb', read_only=True)
          count = con.execute('SELECT COUNT(*) FROM public.person').fetchone()[0]
          assert count == 99, f'Expected 99 persons, got {count}'
          print('PASS: Person count is 99')
          "

      # 1130 persons
      - name: Run Docker container for DuckDB (synthetic 1000)
        run: |
          mkdir -p duckdb-out-1000
          chmod 777 duckdb-out-1000
          docker run --rm \
          -v "$PWD/duckdb-out-1000:/data" \
          -e DIALECT=duckdb \
          -e DB_NAME=/data/omop.duckdb \
          -e SYNTHETIC=true \
          -e SYNTHETIC_NUMBER=1000 \
          omop-lite

      - name: Verify data in DuckDB (synthetic 1000)
        run: |
          python3 -c "
          import duckdb
          con = duckdb.connect('duckdb-out-1000/omop.duckdb', read_only=True)
          count = con.execute('SELECT COUNT(*) FROM public.person').fetchone()[0]
          assert count == 1130, f'Expected 1130 persons, got {count}'
          print('PASS: Person count is 1130')
          "
